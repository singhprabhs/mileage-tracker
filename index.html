<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Log a day of driving from odometer readings and export a mileage claim as PDF, Excel or CSV." />
    <!-- Theme colour follows the design tokens (--bg in
         src/styles/tokens.css) per colour scheme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116" />
    <!-- Appearance preference (UI Polish Phase 6): apply a stored
         Light / Dark choice before first paint — data-theme for the
         design tokens, and the theme-color metas rewritten to the
         forced scheme — so a forced scheme never flashes the system
         one. Mirrors applyThemePreference in src/ui/theme.ts. -->
    <script>
      try {
        var mtTheme = window.localStorage.getItem("mt-theme");
        if (mtTheme === "light" || mtTheme === "dark") {
          document.documentElement.dataset.theme = mtTheme;
          var mtMetas = document.querySelectorAll('meta[name="theme-color"]');
          if (mtMetas.length >= 2) {
            var mtActive = mtTheme === "light" ? mtMetas[0] : mtMetas[1];
            var mtInactive = mtTheme === "light" ? mtMetas[1] : mtMetas[0];
            mtActive.setAttribute("media", "all");
            mtActive.setAttribute("content", mtTheme === "light" ? "#f6f7f9" : "#0e1116");
            mtInactive.setAttribute("media", "not all");
          }
        }
      } catch (error) {
        // No storage access: the system colour scheme applies.
      }
    </script>
    <!-- Standalone (Home Screen) behaviour on iOS. The status bar style
         is black-translucent: iOS draws its white glyphs over a dark
         translucent scrim, so they stay readable over both our light
         and dark headers, and the shell pads content clear of the bar
         with env(safe-area-inset-top) (src/styles/shell.css). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mileage" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <!-- Startup images: flat token background + centred icon, so a
         Home Screen launch never flashes white. Pixel sizes and media
         queries must match scripts/generate-icons.py. -->
    <link
      rel="apple-touch-startup-image"
      href="splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-startup-image"
      href="splash-1170x2532-dark.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-startup-image"
      href="splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-startup-image"
      href="splash-1290x2796-dark.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-startup-image"
      href="splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-startup-image"
      href="splash-750x1334-dark.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="pwa-192x192.png" />
    <!-- Paint the token background before any stylesheet or script
         loads, so first paint (and the gap before the splash image)
         is never a white flash — especially in dark mode. -->
    <style>
      html {
        background: #f6f7f9;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0e1116;
        }
      }
      /* A forced scheme (Phase 6 appearance setting) beats the
         system media query for the first paint too. */
      html[data-theme="light"] {
        background: #f6f7f9;
      }
      html[data-theme="dark"] {
        background: #0e1116;
      }
    </style>
    <title>Mileage Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
